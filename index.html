<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arch Linux Web Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 1. Boot screen: fake systemd boot log -->
<div id="boot" class="screen"></div>

<!-- 2. Login screen: any password works -->
<div id="login" class="screen">
  <div class="avatar">A</div>
  <div class="uname">user</div>
  <input id="pass" type="password" placeholder="Password (anything works)">
  <button id="loginBtn">Log in</button>
</div>

<!-- 3. Desktop session (hidden until login) -->
<div id="session" class="screen" hidden>

  <!-- Top panel: menu button on the left, clock in the middle -->
  <div id="panel">
    <button id="menuBtn">Arch</button>
    <span id="clock"></span>
    <button id="logoutBtn" title="Log out">Log out</button>
  </div>

  <!-- Dropdown application menu -->
  <div id="menu">
    <div data-app="terminal">Terminal</div>
    <div data-app="files">File Manager</div>
    <div data-app="editor">Text Editor</div>
    <div data-app="settings">Settings</div>
  </div>

  <!-- Desktop area: icons and windows live here -->
  <div id="desktop">
    <div class="icon" style="top:16px"  data-app="terminal"><b>&gt;_</b>Terminal</div>
    <div class="icon" style="top:106px" data-app="files"><b>&#128193;</b>File Manager</div>
    <div class="icon" style="top:196px" data-app="editor"><b>&#128221;</b>Text Editor</div>
    <div class="icon" style="top:286px" data-app="settings"><b>&#9881;</b>Settings</div>
  </div>

  <!-- Dock at the bottom -->
  <div id="dock">
    <button data-app="terminal" title="Terminal">&gt;_</button>
    <button data-app="files" title="File Manager">&#128193;</button>
    <button data-app="editor" title="Text Editor">&#128221;</button>
    <button data-app="settings" title="Settings">&#9881;</button>
  </div>
</div>

<!-- Plain scripts (not ES modules) so the page also works when opened via file:// -->
<script src="js/windows.js"></script>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
